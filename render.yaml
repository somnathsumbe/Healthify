services:
  - type: web
    name: healthify-push-service
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run push:start
    healthCheckPath: /api/push/health
    disk:
      name: healthify-push-db
      mountPath: /opt/render/project/src/push-service/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /opt/render/project/src/push-service/data/push-state.json
      - key: PORT
        value: 10000
      - key: PUSH_API_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://somnathsumbe.github.io
